<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse products from the Fake Store API."
    />
    <title>Product Store</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Discover something new</p>
        <h1>Product Store</h1>
        <p class="intro">A hand-picked collection for every kind of shopper.</p>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">
        Loading products…
      </p>
      <p id="error-message" class="error-message" role="alert" hidden></p>
      <section
        id="product-grid"
        class="product-grid"
        aria-label="Products"
      ></section>
    </main>
  </body>
</html>
